services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daw
      POSTGRES_PASSWORD: daw_local
      POSTGRES_DB: gestion_deportiva
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daw -d gestion_deportiva"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
